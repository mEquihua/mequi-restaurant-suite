name: restaurant-suite

services:
  traefik:
    image: traefik:v3.2
    ports:
      - '${TRAEFIK_HTTP_PORT:-80}:80'
      - '${TRAEFIK_HTTPS_PORT:-443}:443'
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [restaurant-internal]
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../apps/admin/dist:/usr/share/nginx/html/admin:ro
      - ../../apps/staff/dist:/usr/share/nginx/html/staff:ro
      - ../../apps/kitchen/dist:/usr/share/nginx/html/kitchen:ro
      - ../../apps/self-service/dist:/usr/share/nginx/html/self-service:ro
      - ../../apps/customer/dist:/usr/share/nginx/html/customer:ro
    networks: [restaurant-internal]

  api:
    image: node:22-alpine
    working_dir: /workspace
    command: node services/api/dist/server.js
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${API_LOG_LEVEL:-info}
    volumes:
      - ../..:/workspace:ro
    networks: [restaurant-internal]
    depends_on:
      postgres:
        condition: service_started
      valkey:
        condition: service_started

  worker:
    image: node:22-alpine
    working_dir: /workspace
    command: node services/worker/dist/index.js
    environment:
      NODE_ENV: production
    volumes:
      - ../..:/workspace:ro
    networks: [restaurant-internal]
    depends_on:
      postgres:
        condition: service_started
      valkey:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_suite}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_suite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [restaurant-internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0-alpine
    command: valkey-server --save '' --appendonly no
    networks: [restaurant-internal]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  local-connectivity:
    image: busybox:1.37
    command: sh -c 'echo local-connectivity placeholder started; trap exit TERM INT; while :; do sleep 3600 & wait $$!; done'
    volumes:
      - local-connectivity-data:/var/lib/restaurant-suite/local-connectivity
    networks: [restaurant-internal]

  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    command: tunnel --no-autoupdate run --token $${CLOUDFLARED_TUNNEL_TOKEN}
    environment:
      CLOUDFLARED_TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    profiles: [remote]
    networks: [restaurant-internal]

volumes:
  postgres-data:
  local-connectivity-data:

networks:
  restaurant-internal:
    internal: true
