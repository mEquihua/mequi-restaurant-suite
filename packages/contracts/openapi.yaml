openapi: 3.1.0
info:
  title: Restaurant Suite API
  version: 0.1.0
  description: REST API versioned under /api/v1.
paths:
  /api/v1/ping:
    get:
      operationId: ping
      summary: Confirm that the API is reachable
      responses:
        '200': { description: The API is reachable, content: { application/json: { schema: { $ref: '#/components/schemas/PingResponse' } } } }
  /api/v1/terminals/enroll:
    post:
      operationId: enrollTerminal
      x-required-permission: iam.terminals.enroll
      security: [{ staffSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollTerminalRequest' } } } }
      responses:
        '201': { description: Terminal enrolled; credential is returned once, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollTerminalResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/terminals:
    get:
      operationId: listTerminals
      x-required-permission: iam.terminals.read
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Terminals in the authenticated session location, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/auth/pin-unlock:
    post:
      operationId: pinUnlock
      summary: Verify a staff PIN on an enrolled terminal
      description: Requires the enrollment credential in X-Terminal-Credential. Failed attempts back off per terminal and presented staff credential; 429 includes Retry-After.
      parameters: [{ $ref: '#/components/parameters/TerminalCredential' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PinUnlockRequest' } } } }
      responses:
        '201': { description: New opaque staff session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { description: Per-terminal PIN backoff is active, headers: { Retry-After: { schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Rotated staff session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ staffSession: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/me:
    get:
      operationId: getCurrentStaffSession
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Current staff identity and effective RBAC grants, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/staff:
    get:
      operationId: listStaff
      x-required-permission: iam.staff.read
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Staff assigned to current location or organization-wide, content: { application/json: { schema: { $ref: '#/components/schemas/StaffListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createStaff
      x-required-permission: iam.staff.write
      security: [{ staffSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateStaffRequest' } } } }
      responses:
        '201': { description: Staff created and assigned at current location, content: { application/json: { schema: { $ref: '#/components/schemas/Staff' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/staff/{id}:
    put:
      operationId: updateStaff
      x-required-permission: iam.staff.write
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Current staff version, schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStaffRequest' } } } }
      responses:
        '200': { description: Updated staff, content: { application/json: { schema: { $ref: '#/components/schemas/Staff' } } } }
        '409': { description: Optimistic concurrency conflict with current staff state, content: { application/json: { schema: { $ref: '#/components/schemas/ConcurrencyConflict' } } } }
        '428': { $ref: '#/components/responses/Error' }
  /api/v1/roles:
    get:
      operationId: listRoles
      x-required-permission: iam.roles.read
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Roles and grants for organization, content: { application/json: { schema: { $ref: '#/components/schemas/RoleListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/roles/{id}/permissions:
    put:
      operationId: replaceRolePermissions
      x-required-permission: iam.permissions.grant
      security: [{ staffSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRolePermissionsRequest' } } } }
      responses:
        '200': { description: Role permission set replaced, content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissionsResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    staffSession: { type: http, scheme: bearer, bearerFormat: opaque }
  parameters:
    TerminalCredential: { name: X-Terminal-Credential, in: header, required: true, schema: { type: string, minLength: 70 }, description: Enrollment credential returned once by terminal enrollment. }
  responses:
    Error: { description: API error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    Uuid: { type: string, format: uuid }
    PingResponse: { type: object, additionalProperties: false, required: [ok], properties: { ok: { type: boolean, const: true } } }
    Terminal: { type: object, additionalProperties: false, required: [id, location_id, name, device_profile, is_active, version], properties: { id: { $ref: '#/components/schemas/Uuid' }, location_id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, device_profile: { type: [string, 'null'] }, is_active: { type: boolean }, version: { type: integer, minimum: 1 } } }
    EnrollTerminalRequest: { type: object, additionalProperties: false, required: [location_id, name], properties: { location_id: { $ref: '#/components/schemas/Uuid' }, name: { type: string, minLength: 1, maxLength: 120 }, device_profile: { type: string, maxLength: 120 } } }
    EnrollTerminalResponse: { type: object, additionalProperties: false, required: [terminal, terminal_credential], properties: { terminal: { $ref: '#/components/schemas/Terminal' }, terminal_credential: { type: string, writeOnly: true } } }
    TerminalListResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Terminal' } } } }
    PinUnlockRequest: { type: object, additionalProperties: false, required: [staff_id, pin], properties: { staff_id: { $ref: '#/components/schemas/Uuid' }, pin: { type: string, minLength: 4, maxLength: 12, writeOnly: true } } }
    SessionResponse: { type: object, additionalProperties: false, required: [token, expires_at, staff_id, location_id], properties: { token: { type: string, writeOnly: true }, expires_at: { type: string, format: date-time }, staff_id: { $ref: '#/components/schemas/Uuid' }, location_id: { $ref: '#/components/schemas/Uuid' } } }
    Staff: { type: object, additionalProperties: false, required: [id, first_name, last_name, active, version], properties: { id: { $ref: '#/components/schemas/Uuid' }, first_name: { type: string }, last_name: { type: string }, active: { type: boolean }, version: { type: integer, minimum: 1 } } }
    StaffListResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Staff' } } } }
    CreateStaffRequest: { type: object, additionalProperties: false, required: [first_name, last_name, pin, role_ids], properties: { first_name: { type: string, minLength: 1 }, last_name: { type: string, minLength: 1 }, pin: { type: string, pattern: '^\\d{4,12}$', writeOnly: true }, role_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Uuid' } } } }
    UpdateStaffRequest: { type: object, additionalProperties: false, minProperties: 1, properties: { first_name: { type: string, minLength: 1 }, last_name: { type: string, minLength: 1 }, active: { type: boolean }, pin: { type: string, pattern: '^\\d{4,12}$', writeOnly: true } } }
    PermissionGrant: { type: object, additionalProperties: false, required: [permission_name, scope], properties: { permission_name: { type: string, pattern: '^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$' }, scope: { type: string, enum: [organization, location] } } }
    Role: { type: object, additionalProperties: false, required: [id, name, description, is_system_template, permissions], properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, description: { type: [string, 'null'] }, is_system_template: { type: boolean }, permissions: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } } } }
    RoleListResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Role' } } } }
    ReplaceRolePermissionsRequest: { type: object, additionalProperties: false, required: [permissions], properties: { permissions: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } } } }
    RolePermissionsResponse: { type: object, additionalProperties: false, required: [id, permissions], properties: { id: { $ref: '#/components/schemas/Uuid' }, permissions: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } } } }
    MeResponse: { type: object, additionalProperties: false, required: [staff, location_id, terminal_id, roles, permissions], properties: { staff: { $ref: '#/components/schemas/Staff' }, location_id: { $ref: '#/components/schemas/Uuid' }, terminal_id: { $ref: '#/components/schemas/Uuid' }, roles: { type: array, items: { type: object, additionalProperties: false, required: [id, name, description], properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, description: { type: [string, 'null'] } } } }, permissions: { type: array, items: { type: string } } } }
    ErrorResponse: { type: object, additionalProperties: false, required: [error], properties: { error: { type: object, additionalProperties: true, required: [status, code, message, request_id], properties: { status: { type: integer }, code: { type: string }, message: { type: string }, request_id: { type: string }, details: {} } } } }
    ConcurrencyConflict: { type: object, additionalProperties: false, required: [error], properties: { error: { type: object, additionalProperties: false, required: [status, code, message, request_id, details], properties: { status: { const: 409 }, code: { const: OPTIMISTIC_CONCURRENCY_CONFLICT }, message: { type: string }, request_id: { type: string }, details: { type: object, additionalProperties: false, required: [current_version, current_state], properties: { current_version: { type: integer }, current_state: { $ref: '#/components/schemas/Staff' } } } } } } }
