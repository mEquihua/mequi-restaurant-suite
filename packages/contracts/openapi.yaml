    DeliveryZone:
      type: object
      required:
        - id
        - name
        - fee
        - minimum_order_amount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        fee:
          type: integer
        minimum_order_amount:
          type: integer
    DeliveryZoneAdmin:
      allOf:
        - $ref: "#/components/schemas/DeliveryZone"
        - type: object
          required:
            - location_id
            - active
            - version
          properties:
            location_id:
              type: string
              format: uuid
            active:
              type: boolean
            version:
              type: integer
    DeliveryZoneListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryZone"
    DeliveryZoneAdminListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryZoneAdmin"
    CreateDeliveryZoneRequest:
      type: object
      required:
        - name
        - fee
      properties:
        name:
          type: string
        fee:
          type: integer
        minimum_order_amount:
          type: integer
    UpdateDeliveryZoneRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
        name:
          type: string
        fee:
          type: integer
        minimum_order_amount:
          type: integer
        active:
          type: boolean
