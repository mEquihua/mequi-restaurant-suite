openapi: 3.1.0
info:
  title: Restaurant Suite API
  version: 0.1.0
  description: REST API versioned under /api/v1.
paths:
  /api/v1/ping:
    get:
      operationId: ping
      summary: Confirm that the API is reachable
      responses:
        '200': { description: The API is reachable, content: { application/json: { schema: { $ref: '#/components/schemas/PingResponse' } } } }
  /api/v1/terminals/enroll:
    post:
      operationId: enrollTerminal
      x-required-permission: iam.terminals.enroll
      security: [{ staffSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollTerminalRequest' } } } }
      responses:
        '201': { description: Terminal enrolled; credential is returned once, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollTerminalResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/terminals:
    get:
      operationId: listTerminals
      x-required-permission: iam.terminals.read
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Terminals in the authenticated session location, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/auth/pin-unlock:
    post:
      operationId: pinUnlock
      summary: Verify a staff PIN on an enrolled terminal
      description: Requires the enrollment credential in X-Terminal-Credential. Failed attempts back off per terminal and presented staff credential; 429 includes Retry-After.
      parameters: [{ $ref: '#/components/parameters/TerminalCredential' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PinUnlockRequest' } } } }
      responses:
        '201': { description: New opaque staff session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { description: Per-terminal PIN backoff is active, headers: { Retry-After: { schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Rotated staff session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ staffSession: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/me:
    get:
      operationId: getCurrentStaffSession
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Current staff identity and effective RBAC grants, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/staff:
    get:
      operationId: listStaff
      x-required-permission: iam.staff.read
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Staff assigned to current location or organization-wide, content: { application/json: { schema: { $ref: '#/components/schemas/StaffListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createStaff
      x-required-permission: iam.staff.write
      security: [{ staffSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateStaffRequest' } } } }
      responses:
        '201': { description: Staff created and assigned at current location, content: { application/json: { schema: { $ref: '#/components/schemas/Staff' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/staff/{id}:
    put:
      operationId: updateStaff
      x-required-permission: iam.staff.write
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Current staff version, schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStaffRequest' } } } }
      responses:
        '200': { description: Updated staff, content: { application/json: { schema: { $ref: '#/components/schemas/Staff' } } } }
        '409': { description: Optimistic concurrency conflict with current staff state, content: { application/json: { schema: { $ref: '#/components/schemas/ConcurrencyConflict' } } } }
        '428': { $ref: '#/components/responses/Error' }
  /api/v1/roles:
    get:
      operationId: listRoles
      x-required-permission: iam.roles.read
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Roles and grants for organization, content: { application/json: { schema: { $ref: '#/components/schemas/RoleListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/roles/{id}/permissions:
    put:
      operationId: replaceRolePermissions
      x-required-permission: iam.permissions.grant
      security: [{ staffSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRolePermissionsRequest' } } } }
      responses:
        '200': { description: Role permission set replaced, content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissionsResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/categories:
    get:
      operationId: listCategories
      x-required-permission: menu.catalog.read
      security: [{ staffSession: [] }]
      responses:
        '200': { description: Organization categories, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCategory
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCategoryRequest' } } } }
      responses:
        '201': { description: Category created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/products:
    get:
      operationId: listProducts
      x-required-permission: menu.catalog.read
      security: [{ staffSession: [] }]
      parameters:
        - { name: channel, in: query, schema: { type: string }, description: Channel for server-resolved availability. }
        - { name: service_type, in: query, schema: { type: string }, description: Service type for server-resolved availability. }
        - { name: at, in: query, schema: { type: string, format: date-time }, description: Instant used to evaluate scheduled availability. }
      responses:
        '200': { description: Products priced and resolved for the authenticated location, content: { application/json: { schema: { $ref: '#/components/schemas/ProductListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProduct
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProductRequest' } } } }
      responses:
        '201': { description: Product created with server-resolved location price, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/products/{id}:
    put:
      operationId: updateProduct
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Current product version, schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProductRequest' } } } }
      responses:
        '200': { description: Updated product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/v1/products/{id}/variants:
    post:
      operationId: createProductVariant
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateVariantRequest' } } } }
      responses: { '201': { description: Variant created, content: { application/json: { schema: { $ref: '#/components/schemas/Variant' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/products/{id}/modifier-groups:
    post:
      operationId: attachProductModifierGroup
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttachModifierGroupRequest' } } } }
      responses: { '201': { description: Modifier group attached, content: { application/json: { schema: { $ref: '#/components/schemas/ProductModifierGroup' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/products/{id}/combo-groups:
    post:
      operationId: createProductComboGroup
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateComboGroupRequest' } } } }
      responses: { '201': { description: Combo group created, content: { application/json: { schema: { $ref: '#/components/schemas/ComboGroup' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/products/{id}/duplicate:
    post:
      operationId: duplicateProduct
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      responses: { '201': { description: Product copy created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/modifier-groups:
    post:
      operationId: createModifierGroup
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateModifierGroupRequest' } } } }
      responses: { '201': { description: Modifier group created, content: { application/json: { schema: { $ref: '#/components/schemas/ModifierGroup' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/modifier-groups/{id}/modifiers:
    post:
      operationId: createModifier
      x-required-permission: menu.products.write
      security: [{ staffSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateModifierRequest' } } } }
      responses: { '201': { description: Modifier created, content: { application/json: { schema: { $ref: '#/components/schemas/Modifier' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/locations/{locationId}/price-overrides/{productId}:
    put:
      operationId: putLocationPriceOverride
      x-required-permission: menu.prices.update
      security: [{ staffSession: [] }]
      parameters:
        - { name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: productId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Override version; use 0 when creating the first override, schema: { type: string, pattern: '^"?[0-9]+"?$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutPriceOverrideRequest' } } } }
      responses: { '200': { description: Stored location override, content: { application/json: { schema: { $ref: '#/components/schemas/LocationPriceOverride' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/locations/{locationId}/products/{productId}/mark-unavailable:
    post:
      operationId: markProductUnavailable
      x-required-permission: menu.availability.update
      security: [{ staffSession: [] }]
      parameters:
        - { name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: productId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Availability-rule version; use 0 to create a scoped rule, schema: { type: string, pattern: '^"?[0-9]+"?$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MarkUnavailableRequest' } } } }
      responses: { '200': { description: Explicit availability operation recorded, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityRule' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/locations/{locationId}/products/{productId}/mark-available:
    post:
      operationId: markProductAvailable
      x-required-permission: menu.availability.update
      security: [{ staffSession: [] }]
      parameters:
        - { name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: productId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Availability-rule version; use 0 to create a scoped rule, schema: { type: string, pattern: '^"?[0-9]+"?$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MarkAvailableRequest' } } } }
      responses: { '200': { description: Explicit availability operation recorded, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityRule' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/locations/{locationId}/areas:
    get:
      operationId: listAreas
      x-required-permission: floor.layout.read
      security: [{ staffSession: [] }]
      parameters: [{ name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      responses: { '200': { description: Areas in the authenticated session location, content: { application/json: { schema: { $ref: '#/components/schemas/AreaListResponse' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createArea
      x-required-permission: floor.layout.write
      security: [{ staffSession: [] }]
      parameters: [{ name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAreaRequest' } } } }
      responses: { '201': { description: Area created, content: { application/json: { schema: { $ref: '#/components/schemas/Area' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/locations/{locationId}/tables:
    get:
      operationId: listTables
      x-required-permission: floor.layout.read
      security: [{ staffSession: [] }]
      parameters: [{ name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      responses: { '200': { description: Tables in the authenticated session location, content: { application/json: { schema: { $ref: '#/components/schemas/TableListResponse' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createTable
      x-required-permission: floor.layout.write
      security: [{ staffSession: [] }]
      parameters: [{ name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTableRequest' } } } }
      responses: { '201': { description: Table created, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/tables/{id}:
    put:
      operationId: updateTable
      x-required-permission: floor.layout.write
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Current table version, schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTableRequest' } } } }
      responses: { '200': { description: Updated table, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '428': { $ref: '#/components/responses/Error' } }
  /api/v1/tables/{id}/mark-needs-cleaning:
    post:
      operationId: markTableNeedsCleaning
      x-required-permission: floor.tables.update_status
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Current table version, schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' } }
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmptyObjectRequest' } } } }
      responses: { '200': { description: Table marked as needing cleaning, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '428': { $ref: '#/components/responses/Error' } }
  /api/v1/tables/{id}/mark-available:
    post:
      operationId: markTableAvailable
      x-required-permission: floor.tables.update_status
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Current table version, schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' } }
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmptyObjectRequest' } } } }
      responses: { '200': { description: Table marked as available, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '428': { $ref: '#/components/responses/Error' } }
  /api/v1/tables/{id}/mark-out-of-service:
    post:
      operationId: markTableOutOfService
      x-required-permission: floor.tables.update_status
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: If-Match, in: header, required: true, description: Current table version, schema: { type: string, pattern: '^"?[1-9][0-9]*"?$' } }
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmptyObjectRequest' } } } }
      responses: { '200': { description: Table marked as out of service, content: { application/json: { schema: { $ref: '#/components/schemas/Table' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '428': { $ref: '#/components/responses/Error' } }
  /api/v1/locations/{locationId}/sections:
    get:
      operationId: listSections
      x-required-permission: floor.layout.read
      security: [{ staffSession: [] }]
      parameters: [{ name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      responses: { '200': { description: Sections in the authenticated session location, content: { application/json: { schema: { $ref: '#/components/schemas/SectionListResponse' } } } }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createSection
      x-required-permission: floor.layout.write
      security: [{ staffSession: [] }]
      parameters: [{ name: locationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSectionRequest' } } } }
      responses: { '201': { description: Section created, content: { application/json: { schema: { $ref: '#/components/schemas/Section' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/sections/{id}/tables:
    put:
      operationId: replaceSectionTables
      x-required-permission: floor.sections.assign
      security: [{ staffSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceSectionTablesRequest' } } } }
      responses: { '200': { description: Section table assignments replaced, content: { application/json: { schema: { $ref: '#/components/schemas/SectionTablesResponse' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
components:
  securitySchemes:
